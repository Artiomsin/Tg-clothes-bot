services:
  postgres:
    image: postgres:15
    container_name: clothes_postgres
    restart: always
    environment:
      POSTGRES_USER: clothes_user
      POSTGRES_PASSWORD: clothes_pass
      POSTGRES_DB: clothes_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
